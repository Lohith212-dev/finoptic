<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meridian — Technology Financial Management</title>
<style>
:root{
  --paper:#FAFAFB; --surface:#FFFFFF; --surface-2:#F5F6F8;
  --ink:#0F1219; --ink-2:#565D6B; --ink-3:#8B929E; --ink-4:#B4BAC4;
  --line:#E6E8ED; --line-2:#D2D6DE;
  --pos:#15734A; --pos-bg:#EAF3EE;
  --neg:#A82F1C; --neg-bg:#FBEDEA;
  --warn:#8A5D06; --warn-bg:#FBF3E4;
  --info:#2B457F; --info-bg:#EDF0F7;
  --g1:#0F1219; --g2:#333A47; --g3:#565D6B; --g4:#7C838F;
  --g5:#A2A8B3; --g6:#C2C7D0; --g7:#DDE0E6; --g8:#EEF0F3;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  --nav:248px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink); font-family:var(--sans);
  font-size:13px; line-height:1.45; -webkit-font-smoothing:antialiased;
}
.num{font-family:var(--mono); font-variant-numeric:tabular-nums; letter-spacing:-.02em}
button{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--info); outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- shell ---------- */
.app{display:flex; min-height:100vh; max-width:1440px; margin:0 auto; background:var(--paper);
  border-left:1px solid var(--line); border-right:1px solid var(--line)}
.nav{
  width:var(--nav); flex:0 0 var(--nav); background:var(--surface);
  border-right:1px solid var(--line); position:sticky; top:0; height:100vh;
  overflow-y:auto; display:flex; flex-direction:column;
}
.brand{padding:20px 20px 16px; border-bottom:1px solid var(--line)}
.brand-mark{display:flex; align-items:center; gap:9px}
.brand-glyph{
  width:22px;height:22px;border:1.5px solid var(--ink);border-radius:3px;
  display:grid;place-items:center;font-family:var(--mono);font-size:11px;font-weight:600
}
.brand-name{font-size:14px; font-weight:640; letter-spacing:-.02em}
.brand-sub{font-family:var(--mono); font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); margin-top:7px}

.persona{padding:12px 14px; border-bottom:1px solid var(--line)}
.persona-label{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px;padding-left:6px}
.persona select{
  width:100%; padding:7px 8px; border:1px solid var(--line-2); border-radius:5px;
  background:var(--surface); font-size:12.5px; color:var(--ink); font-family:var(--sans);
}
.navgroups{padding:10px 8px 24px; flex:1}
.navgroup-label{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-4);padding:12px 12px 6px}
.navlink{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  padding:6px 12px; border:0; background:none; border-radius:5px; cursor:pointer;
  color:var(--ink-2); font-size:12.5px; letter-spacing:-.005em;
}
.navlink:hover{background:var(--surface-2); color:var(--ink)}
.navlink.on{background:var(--ink); color:#fff}
.navlink.on .navdot{background:#fff}
.navdot{width:4px;height:4px;border-radius:50%;background:var(--ink-4);flex:0 0 4px}
.navlink .kbd{margin-left:auto;font-family:var(--mono);font-size:9.5px;color:var(--ink-4)}
.navlink.on .kbd{color:rgba(255,255,255,.55)}

.main{flex:1; min-width:0}

/* ---------- topbar + filters ---------- */
.topbar{
  position:sticky; top:0; z-index:20; background:rgba(250,250,251,.92);
  backdrop-filter:blur(8px); border-bottom:1px solid var(--line);
}
.topbar-row{display:flex; align-items:center; gap:12px; padding:14px 28px 12px}
.crumbs{font-family:var(--mono); font-size:10.5px; color:var(--ink-3); letter-spacing:.02em}
.crumbs b{color:var(--ink); font-weight:600}
.crumbs span{color:var(--ink-4); margin:0 5px}
.topbar-actions{margin-left:auto; display:flex; gap:8px}
.btn{
  padding:6px 11px; border:1px solid var(--line-2); background:var(--surface);
  border-radius:5px; font-size:12px; cursor:pointer; color:var(--ink-2);
}
.btn:hover{border-color:var(--ink-3); color:var(--ink)}
.btn.pri{background:var(--ink); color:#fff; border-color:var(--ink)}
.filters{display:flex; gap:6px; padding:0 28px 12px; flex-wrap:wrap; align-items:center}
.chip{
  display:inline-flex; align-items:center; gap:6px; padding:5px 9px;
  border:1px solid var(--line-2); border-radius:20px; background:var(--surface);
  font-size:11.5px; color:var(--ink-2); cursor:pointer; white-space:nowrap;
}
.chip:hover{border-color:var(--ink-3)}
.chip em{font-style:normal; color:var(--ink-4); font-family:var(--mono); font-size:9px; letter-spacing:.08em; text-transform:uppercase}
.chip.set{border-color:var(--ink); color:var(--ink); background:var(--surface-2)}
.chip .x{color:var(--ink-4)}

/* ---------- signature: reconciliation ledger strip ---------- */
.ledger{
  display:flex; align-items:stretch; border-bottom:1px solid var(--line);
  background:var(--surface); overflow-x:auto; scrollbar-width:none;
}
.ledger::-webkit-scrollbar{display:none}
.ledger-cell{
  padding:10px 18px; border-right:1px solid var(--line); display:flex;
  flex-direction:column; gap:2px; min-width:0;
}
.ledger-cell:last-child{border-right:0; margin-left:auto; text-align:right}
.ledger-k{font-family:var(--mono); font-size:9px; letter-spacing:.11em; text-transform:uppercase; color:var(--ink-3)}
.ledger-v{font-family:var(--mono); font-size:15px; font-weight:600; letter-spacing:-.03em; font-variant-numeric:tabular-nums}
.ledger-op{
  display:grid; place-items:center; padding:0 4px; color:var(--ink-4);
  font-family:var(--mono); font-size:13px; border-right:1px solid var(--line);
}

/* ---------- content grid ---------- */
.content{padding:22px 28px 64px}
.grid{display:grid; grid-template-columns:repeat(12,1fr); gap:12px}
.c2{grid-column:span 2}.c3{grid-column:span 3}.c4{grid-column:span 4}
.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}
.c8{grid-column:span 8}.c9{grid-column:span 9}.c12{grid-column:span 12}

.pagehead{margin-bottom:18px; display:flex; align-items:flex-end; gap:16px}
.pagehead h1{font-size:20px; font-weight:640; letter-spacing:-.03em; margin:0}
.pagehead p{margin:3px 0 0; color:var(--ink-2); font-size:12.5px; max-width:62ch}
.pagehead .persona-tag{
  margin-left:auto; font-family:var(--mono); font-size:9.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-2); border:1px solid var(--line-2);
  padding:4px 8px; border-radius:4px; background:var(--surface); white-space:nowrap;
}

/* ---------- cards ---------- */
.card{background:var(--surface); border:1px solid var(--line); border-radius:7px; overflow:hidden}
.card-h{padding:12px 14px 0; display:flex; align-items:baseline; gap:8px}
.card-h h3{margin:0; font-size:12.5px; font-weight:620; letter-spacing:-.01em}
.card-h .hint{font-size:11px; color:var(--ink-3); margin-left:auto; font-family:var(--mono); font-size:10px}
.card-b{padding:12px 14px 14px}
.card-note{
  padding:9px 14px; border-top:1px solid var(--line); background:var(--surface-2);
  font-size:11.5px; color:var(--ink-2);
}
.card-note b{color:var(--ink); font-weight:600}

/* KPI */
.kpi{grid-column:span 3; background:var(--surface); border:1px solid var(--line); border-radius:7px; padding:11px 13px 12px}
.kpi-k{font-family:var(--mono); font-size:9px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); display:block; margin-bottom:6px}
.kpi-v{font-family:var(--mono); font-size:21px; font-weight:600; letter-spacing:-.045em; display:block; line-height:1.1}
.kpi-f{display:flex; align-items:center; gap:6px; margin-top:6px; font-size:11px; color:var(--ink-3)}
.kpi.hero .kpi-v{font-size:30px}
.kpi.hero{grid-column:span 3}

.delta{font-family:var(--mono); font-size:11px; font-weight:600; letter-spacing:-.01em}
.delta.up{color:var(--neg)} .delta.down{color:var(--pos)}
.delta.gup{color:var(--pos)} .delta.gdown{color:var(--neg)}
.delta.flat{color:var(--ink-3)}

.badge{
  display:inline-flex; align-items:center; gap:5px; padding:2px 7px; border-radius:4px;
  font-size:10.5px; font-weight:560; font-family:var(--mono); letter-spacing:.01em; white-space:nowrap;
}
.badge.crit{background:var(--neg-bg); color:var(--neg)}
.badge.high{background:var(--warn-bg); color:var(--warn)}
.badge.med{background:var(--info-bg); color:var(--info)}
.badge.low{background:var(--surface-2); color:var(--ink-3)}
.badge.ok{background:var(--pos-bg); color:var(--pos)}
.badge.n{background:var(--surface-2); color:var(--ink-2)}

/* ---------- tables ---------- */
table{width:100%; border-collapse:collapse; font-size:12px}
thead th{
  text-align:left; font-family:var(--mono); font-size:9px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-3); font-weight:500;
  padding:8px 10px; border-bottom:1px solid var(--line-2); white-space:nowrap;
}
tbody td{padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
.r{text-align:right}
td.r,th.r{font-family:var(--mono); font-variant-numeric:tabular-nums}
th.r{font-family:var(--mono)}
td.mono{font-family:var(--mono); font-size:11.5px}
tr.total td{border-top:1px solid var(--line-2); font-weight:640; background:var(--surface-2)}
.tbl-scroll{overflow-x:auto}
.sub{color:var(--ink-3); font-size:11px}
.namecell{display:flex; flex-direction:column; gap:1px}
.namecell b{font-weight:580}

/* meters */
.meter{height:5px; background:var(--surface-2); border-radius:3px; overflow:hidden; min-width:52px}
.meter i{display:block; height:100%; background:var(--g3)}
.meter.good i{background:var(--pos)} .meter.bad i{background:var(--neg)} .meter.warn i{background:var(--warn)}
.util{display:flex; align-items:center; gap:8px; justify-content:flex-end}
.util .num{font-size:11px; min-width:34px; text-align:right}

/* legend */
.legend{display:flex; flex-wrap:wrap; gap:4px 14px; margin-top:10px}
.legend div{display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--ink-2)}
.legend i{width:8px; height:8px; border-radius:2px; flex:0 0 8px}
.legend b{margin-left:auto; font-family:var(--mono); color:var(--ink); font-weight:560; font-size:11px}
.legend.rows{flex-direction:column; gap:5px}
.legend.rows div{width:100%}

/* insight strip */
.insight{
  display:flex; gap:12px; align-items:flex-start; padding:11px 13px;
  border:1px solid var(--line); border-left:2px solid var(--ink); border-radius:6px;
  background:var(--surface);
}
.insight .q{font-family:var(--mono); font-size:9px; letter-spacing:.11em; text-transform:uppercase; color:var(--ink-3); white-space:nowrap; padding-top:2px}
.insight p{margin:0; font-size:12.5px; color:var(--ink-2)}
.insight p b{color:var(--ink); font-weight:600}
.insight.act{border-left-color:var(--pos)}
.insight.warn{border-left-color:var(--warn)}
.insight.crit{border-left-color:var(--neg)}

/* drill path */
.path{display:flex; flex-wrap:wrap; align-items:center; gap:0; font-family:var(--mono); font-size:11px}
.path button{
  border:0; background:none; padding:4px 8px; cursor:pointer; color:var(--ink-2);
  border-radius:4px;
}
.path button:hover{background:var(--surface-2); color:var(--ink)}
.path button.on{background:var(--ink); color:#fff}
.path .sep{color:var(--ink-4); padding:0 1px}

/* list rows */
.rows{display:flex; flex-direction:column}
.row{display:flex; align-items:center; gap:12px; padding:10px 14px; border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface-2)}
.row .grow{flex:1; min-width:0}
.row .t{font-size:12.5px; font-weight:560}
.row .d{font-size:11.5px; color:var(--ink-3); margin-top:1px}
.row .v{font-family:var(--mono); font-size:13px; font-weight:600; text-align:right; white-space:nowrap}

svg{display:block; max-width:100%}
.axis{font-family:var(--mono); font-size:9px; fill:var(--ink-3)}
.gridline{stroke:var(--line); stroke-width:1}
.zeroline{stroke:var(--line-2); stroke-width:1}

@media (max-width:1100px){
  :root{--nav:60px}
  .brand-name,.brand-sub,.navlink span:not(.navdot),.persona,.navgroup-label{display:none}
  .navlink{justify-content:center}
  .c3,.c4,.c5,.c6,.c7,.c8,.c9{grid-column:span 12}
  .kpi.hero{grid-column:span 12}
}
</style>
</head>

const RAMP = ['--g1','--g2','--g3','--g4','--g5','--g6','--g7','--g8'];

function lineChart(series, labels, o={}){
  const W=o.w||680, H=o.h||210, L=44, R=12, Tp=12, B=24;
  const all = series.flatMap(s=>s.values).filter(v=>v!==null);
  const max = o.max || Math.ceil(Math.max(...all)*1.12/10)*10, min=0;
  const x = i => L + i*((W-L-R)/(labels.length-1));
  const y = v => Tp + (H-Tp-B)*(1-(v-min)/(max-min));
  const ticks=[0,.25,.5,.75,1].map(t=>min+(max-min)*t);
  let g='';
  ticks.forEach(t=>{g+=`<line class="gridline" x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}"/>
    <text class="axis" x="${L-8}" y="${y(t)+3}" text-anchor="end">${o.fmt?o.fmt(t):'$'+Math.round(t)+'K'}</text>`});
  labels.forEach((l,i)=>{g+=`<text class="axis" x="${x(i)}" y="${H-8}" text-anchor="middle">${l}</text>`});
  series.forEach(s=>{
    const pts = s.values.map((v,i)=>v===null?null:[x(i),y(v)]).filter(Boolean);
    const d = pts.map((p,i)=>(i?'L':'M')+p[0]+' '+p[1]).join(' ');
    if(s.area){
      const first=s.values.findIndex(v=>v!==null);
      g+=`<path d="${d} L${pts[pts.length-1][0]} ${y(0)} L${x(first)} ${y(0)} Z" fill="var(${s.color})" opacity=".05"/>`;
    }
    g+=`<path d="${d}" fill="none" stroke="var(${s.color})" stroke-width="${s.w||1.75}" ${s.dash?`stroke-dasharray="4 3"`:''} stroke-linejoin="round"/>`;
    if(s.dots) pts.forEach(p=>g+=`<circle cx="${p[0]}" cy="${p[1]}" r="2.4" fill="var(--surface)" stroke="var(${s.color})" stroke-width="1.5"/>`);
  });
  return `<svg viewBox="0 0 ${W} ${H}">${g}</svg>
  <div class="legend">${series.map(s=>`<div><i style="background:var(${s.color});${s.dash?'height:2px;border-radius:0':''}"></i>${s.name}</div>`).join('')}</div>`;
}

function stackedBars(labels, series, o={}){
  const W=o.w||680,H=o.h||210,L=44,R=12,Tp=12,B=24;
  const totals = labels.map((_,i)=>series.reduce((s,x)=>s+(x.values[i]||0),0));
  const max = Math.ceil(Math.max(...totals)*1.12/10)*10;
  const bw = (W-L-R)/labels.length*0.62;
  const cx = i => L + (i+0.5)*((W-L-R)/labels.length);
  const y = v => Tp+(H-Tp-B)*(1-v/max);
  let g='';
  [0,.25,.5,.75,1].forEach(t=>{const v=max*t;g+=`<line class="gridline" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/>
    <text class="axis" x="${L-8}" y="${y(v)+3}" text-anchor="end">$${Math.round(v)}K</text>`});
  labels.forEach((l,i)=>{
    let acc=0;
    series.forEach(s=>{
      const v=s.values[i]||0; const h=(H-Tp-B)*v/max;
      g+=`<rect x="${cx(i)-bw/2}" y="${y(acc+v)}" width="${bw}" height="${h}" fill="var(${s.color})"/>`;
      acc+=v;
    });
    g+=`<text class="axis" x="${cx(i)}" y="${H-8}" text-anchor="middle">${l}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}">${g}</svg>
  <div class="legend">${series.map(s=>`<div><i style="background:var(${s.color})"></i>${s.name}</div>`).join('')}</div>`;
}

function donut(items,o={}){
  const total = items.reduce((s,i)=>s+i.v,0);
  const S=o.size||168, r=S/2-4, ir=o.ir||r*0.62, cx=S/2, cy=S/2;
  let a=-Math.PI/2, g='';
  items.forEach((it,idx)=>{
    const sw = it.v/total*Math.PI*2, b=a+sw;
    const p = (rad,ang)=>[cx+rad*Math.cos(ang), cy+rad*Math.sin(ang)];
    const [x1,y1]=p(r,a),[x2,y2]=p(r,b),[x3,y3]=p(ir,b),[x4,y4]=p(ir,a);
    g+=`<path d="M${x1} ${y1} A${r} ${r} 0 ${sw>Math.PI?1:0} 1 ${x2} ${y2} L${x3} ${y3} A${ir} ${ir} 0 ${sw>Math.PI?1:0} 0 ${x4} ${y4} Z"
      fill="var(${it.g||RAMP[idx%8]})" stroke="var(--surface)" stroke-width="1.5"/>`;
    a=b;
  });
  g+=`<text x="${cx}" y="${cy-2}" text-anchor="middle" style="font-family:var(--mono);font-size:15px;font-weight:600;fill:var(--ink)">${money(total)}</text>
      <text x="${cx}" y="${cy+12}" text-anchor="middle" class="axis" style="font-size:8.5px;letter-spacing:.1em">${o.label||'YTD'}</text>`;
  return `<svg viewBox="0 0 ${S} ${S}" style="width:${S}px;margin:0 auto">${g}</svg>`;
}

function hbars(items,o={}){

        <div style="margin-top:5px;height:6px;background:var(--surface-2);border-radius:2px">

        </div>

}

function waterfall(steps,o={}){
  const W=o.w||680,H=o.h||230,L=48,R=12,Tp=14,B=52;
  let run=0; const pts=[];
  steps.forEach(s=>{
    if(s.type==='base'){pts.push({k:s.k,from:0,to:s.v,type:'base'});run=s.v;}
    else if(s.type==='total'){pts.push({k:s.k,from:0,to:s.v,type:'total'});}
    else {pts.push({k:s.k,from:run,to:run+s.v,type:s.type,delta:s.v});run+=s.v;}
  });
  const max = Math.ceil(Math.max(...pts.map(p=>Math.max(p.from,p.to)))*1.06/50)*50;
  const bw=(W-L-R)/pts.length*0.6, cx=i=>L+(i+0.5)*((W-L-R)/pts.length);
  const y=v=>Tp+(H-Tp-B)*(1-v/max);
  let g='';
  [0,.5,1].forEach(t=>{const v=max*t;g+=`<line class="gridline" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/>
    <text class="axis" x="${L-8}" y="${y(v)+3}" text-anchor="end">$${Math.round(v)}K</text>`});
  pts.forEach((p,i)=>{
    const top=y(Math.max(p.from,p.to)), h=Math.max(2,Math.abs(y(p.to)-y(p.from)));
    const fill = p.type==='base'||p.type==='total'?'var(--g2)':p.type==='up'?'var(--neg)':'var(--pos)';
    g+=`<rect x="${cx(i)-bw/2}" y="${top}" width="${bw}" height="${h}" fill="${fill}" opacity="${p.type==='up'||p.type==='down'?.85:1}"/>`;
    if(i<pts.length-1) g+=`<line x1="${cx(i)+bw/2}" x2="${cx(i+1)-bw/2}" y1="${y(p.to)}" y2="${y(p.to)}" stroke="var(--line-2)" stroke-dasharray="2 2"/>`;
    const lab = p.type==='up'||p.type==='down'?(p.delta>0?'+':'−')+Math.abs(p.delta):Math.round(p.to);
    g+=`<text class="axis" x="${cx(i)}" y="${top-5}" text-anchor="middle" style="fill:var(--ink);font-size:9.5px;font-weight:600">${lab}</text>`;
    const words=p.k.split(' ');
    g+=`<text class="axis" x="${cx(i)}" y="${H-B+16}" text-anchor="middle">${words[0]}</text>`;
    if(words[1]) g+=`<text class="axis" x="${cx(i)}" y="${H-B+27}" text-anchor="middle">${words.slice(1).join(' ')}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}">${g}</svg>`;
}

  const labels=D.meta.months.concat(['Aug','Sep','Oct']);

  const base=[null,null,null,null,null,null,null,null,null,null,162,160,164,168,172];
  const up  =[null,null,null,null,null,null,null,null,null,null,162,168,176,184,192];
  const dn  =[null,null,null,null,null,null,null,null,null,null,162,152,150,148,146];
  const max=220;
  const x=i=>L+i*((W-L-R)/(labels.length-1)), y=v=>Tp+(H-Tp-B)*(1-v/max);
  let g='';
  [0,.25,.5,.75,1].forEach(t=>{const v=max*t;g+=`<line class="gridline" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/>
    <text class="axis" x="${L-8}" y="${y(v)+3}" text-anchor="end">$${Math.round(v)}K</text>`});
  labels.forEach((l,i)=>g+=`<text class="axis" x="${x(i)}" y="${H-8}" text-anchor="middle">${l}</text>`);
  const seg=arr=>arr.map((v,i)=>v===null?null:[x(i),y(v)]).filter(Boolean);
  const U=seg(up),Dn=seg(dn);
  g+=`<path d="${U.map((p,i)=>(i?'L':'M')+p[0]+' '+p[1]).join(' ')} ${Dn.slice().reverse().map(p=>'L'+p[0]+' '+p[1]).join(' ')} Z" fill="var(--g5)" opacity=".13"/>`;
  const line=(arr,col,dash)=>{const s=seg(arr);g+=`<path d="${s.map((p,i)=>(i?'L':'M')+p[0]+' '+p[1]).join(' ')}" fill="none" stroke="var(${col})" stroke-width="1.75" ${dash?'stroke-dasharray="4 3"':''}/>`};
  line(base,'--g3',true); line(act,'--g1',false);
  g+=`<line x1="${x(10)}" x2="${x(10)}" y1="${Tp}" y2="${H-B}" stroke="var(--line-2)"/>
      <text class="axis" x="${x(10)+5}" y="${Tp+9}">forecast →</text>`;
  return `<svg viewBox="0 0 ${W} ${H}">${g}</svg>
  <div class="legend"><div><i style="background:var(--g1)"></i>Actual</div>
  <div><i style="background:var(--g3);height:2px;border-radius:0"></i>Baseline forecast</div>
  <div><i style="background:var(--g5);opacity:.4"></i>Upper / lower range</div></div>`;
}

function flowDiagram(){

  const W=980,H=132,bw=140,gap=(W-stages.length*bw)/(stages.length-1);

        <text x="${x+bw/2}" y="83" text-anchor="middle" style="font-size:10px;fill:var(--ink-2)">${l2||s[1]}</text>`;

/* ============================================================
   Navigation, filters, persona routing
   ============================================================ */
const NAV = [
  ['Overview',[['overview','Executive overview'],['itfm','IT financial management'],['finance','Finance'],
               ['proc','Procurement'],['product','Products']]],
  ['Spend',[['cloud','Cloud'],['ai','AI'],['saas','SaaS & licences'],['security','Security'],
            ['obs','Observability'],['itsm','ITSM']]],
  ['Manage',[['forecast','Budgets & forecasts'],['allocation','Cost allocation'],['optimize','Optimisation'],
             ['anomalies','Anomalies'],['alerts','Alerts']]],
  ['Reference',[['sources','Data model']]]
];
const TITLES = {};
NAV.forEach(g=>g[1].forEach(i=>TITLES[i[0]]=i[1]));

const PERSONA = {
  itfm:{home:'itfm', label:'IT Financial Management', focus:['itfm','cloud','ai','allocation','optimize','forecast']},
  finance:{home:'finance', label:'Finance', focus:['finance','forecast','allocation','anomalies','overview']},
  proc:{home:'proc', label:'Procurement', focus:['proc','saas','ai','optimize']},
  biz:{home:'product', label:'Business / Product', focus:['product','ai','cloud','alerts']}
};

const FILTERS = [
  ['Date range','FY26 · Aug–Jun',true],['Provider','All'],['Department','All'],['Product','All'],
  ['Application','All'],['Environment','All'],['Cost centre','All'],['Vendor','All'],['Category','All']
];

let current = 'overview', persona = 'itfm';

function renderNav(){
  const p = PERSONA[persona];
  document.getElementById('navgroups').innerHTML = NAV.map(g=>`
    <div class="navgroup-label">${g[0]}</div>
    ${g[1].map(i=>`<button class="navlink ${i[0]===current?'on':''}" data-go="${i[0]}">
      <span class="navdot" style="${p.focus.includes(i[0])&&i[0]!==current?'background:var(--ink)':''}"></span>
      <span>${i[1]}</span>${p.focus[0]===i[0]?'<span class="kbd">home</span>':''}</button>`).join('')}
  `).join('');
}

function renderFilters(){
  document.getElementById('filters').innerHTML =
    FILTERS.map((f,i)=>`<button class="chip ${f[2]?'set':''}" data-chip="${i}">
      <em>${f[0]}</em>${f[1]}${f[2]?'<span class="x">×</span>':''}</button>`).join('')
    + `<span style="margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--ink-3)">
       As of ${D.meta.asOf} · 12 sources · last sync 06:14</span>`;
}

function renderLedger(){
  const cells = [
    ['Spend YTD', money(D.ytdActual), ''],
    ['Budget YTD', money(D.ytdBudget), ''],
    ['Variance', '+'+money(D.ytdActual-D.ytdBudget), 'color:var(--neg)'],
    ['Forecast year-end', money(D.fyForecast), ''],
    ['Identified savings', money(D.identified), 'color:var(--pos)'],
    ['Realised', money(D.realized), 'color:var(--pos)'],
    ['Unallocated', money(D.unallocated), 'color:var(--warn)']
  ];
  const ops = ['','−','=','','','','·'];
  document.getElementById('ledger').innerHTML = cells.map((c,i)=>
    `${ops[i]?`<div class="ledger-op">${ops[i]}</div>`:''}
     <div class="ledger-cell"><span class="ledger-k">${c[0]}</span>
     <span class="ledger-v" style="${c[2]}">${c[1]}</span></div>`).join('');
}

function renderCrumbs(){
  const p = PERSONA[persona];
  document.getElementById('crumbs').innerHTML =
    `Meridian <span>/</span> ${p.label} <span>/</span> <b>${TITLES[current]||''}</b>`;
}

function go(id){
  if(!S[id]) id='overview';
  current = id;
  document.getElementById('screen').innerHTML = S[id]();
  renderNav(); renderCrumbs();
  window.scrollTo({top:0,behavior:'instant'});
  if(location.hash.slice(1)!==id) history.replaceState(null,'','#'+id);
}

document.addEventListener('click', e=>{
  const nav = e.target.closest('[data-go]');
  if(nav){ go(nav.dataset.go); return; }
  const chip = e.target.closest('[data-chip]');
  if(chip){ chip.classList.toggle('set'); return; }
  const pathBtn = e.target.closest('.path button');
  if(pathBtn){
    pathBtn.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('on'));
    pathBtn.classList.add('on');
  }
});

document.getElementById('persona').addEventListener('change', e=>{
  persona = e.target.value;
  go(PERSONA[persona].home);
});

renderFilters(); renderLedger();
go(location.hash.slice(1) || 'overview');

</script>
